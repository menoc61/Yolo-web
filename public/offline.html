<!DOCTYPE html>
<html lang="fr-CM">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0b0b0b" />
  <title>YOLO — Hors ligne</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#0b0b0b; color:#fff; font-family:system-ui,sans-serif; min-height:100vh; display:grid; place-items:center; text-align:center; padding:40px 20px; }
    h1 { font-size:1.8rem; font-weight:700; text-transform:uppercase; letter-spacing:0.04em; }
    p { color:#666; margin-top:12px; line-height:1.7; font-size:0.9rem; max-width:360px; }
    .pill { display:inline-block; margin-top:24px; padding:12px 22px; background:#25D366; color:#0b0b0b; font-weight:700; font-size:0.72rem; letter-spacing:0.1em; text-transform:uppercase; text-decoration:none; }
    .brand { font-size:0.6rem; letter-spacing:0.26em; text-transform:uppercase; color:#333; margin-bottom:16px; }
  </style>
</head>
<body>
  <div>
    <div class="brand">Avenue Kennedy, Yaoundé · yolo.co</div>
    <h1>Hors ligne</h1>
    <p>Tu es déconnecté. Les produits et ton panier restent sauvegardés sur ton appareil. Reconnecte-toi pour finaliser la commande.</p>
    <a class="pill" href="javascript:window.location.reload()">Réessayer</a>
  </div>
</body>
</html>
